name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Example scan (should find issues)
        run: |
          set +e; mcp-guard scan examples/ --no-color; test $? -eq 1
      - name: Safe example (should pass)
        run: mcp-guard scan examples/safe_mcp_config.json examples/tools/clean_tools.json
