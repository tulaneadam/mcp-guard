[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Static security scanner for MCP (Model Context Protocol) client configs and tool definitions: tool poisoning, rug pulls, leaked secrets, unpinned servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adam Goldfine" }]
keywords = ["mcp", "model-context-protocol", "ai-security", "prompt-injection", "llm", "agents", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[project.urls]
Homepage = "https://github.com/tulaneadam/mcp-guard"
Issues = "https://github.com/tulaneadam/mcp-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
